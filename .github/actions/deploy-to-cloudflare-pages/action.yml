name: "Deploy to Cloudflare Pages"
description: "Deploys the production version of a Cloudflare Pages project. Pull request previews go through .github/workflows/deploy-previews.yml, because a pull_request run started from a fork holds no Cloudflare credentials."
inputs:
  project_name:
    description: "CloudFlare Pages project name"
  deploy_dir:
    description: "The directory from which to deploy."
    required: true
  cloudflare_api_token:
    description: "The Cloudflare API token to use for deployment."
    required: true
  cloudflare_account_id:
    description: "The Cloudflare account ID to use for deployment."
    required: true
runs:
  using: composite
  steps:
    # Installed globally to avoid workspace issues, and at a fixed version so a
    # production deploy cannot change under the repository. Renovate moves the
    # pin (see customManagers in renovate.json).
    - name: Install Wrangler
      shell: bash
      run: npm install -g wrangler@4.136.3

    # Deploy using Wrangler (use pre-installed wrangler)
    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
      with:
        apiToken: ${{ inputs.cloudflare_api_token }}
        accountId: ${{ inputs.cloudflare_account_id }}
        # On release events github.ref_name is the tag (e.g. v0.103.0), so force the production branch.
        command: pages deploy ${{ inputs.deploy_dir }} --project-name=${{ inputs.project_name}} --branch=${{ github.event_name == 'release' && 'main' || github.ref_name }}
        wranglerVersion: ''  # Use pre-installed version
