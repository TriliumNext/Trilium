name: Deploy Documentation

on:
  # Trigger on push to main branch
  push:
    branches:
      - main
      - stable
    # Only run when docs files change
    paths:
      - 'docs/**'
      - 'apps/edit-docs/**'
      - 'apps/build-docs/**'
      - 'packages/share-theme/**'

  # Allow manual triggering from Actions tab
  workflow_dispatch:

  # Run on pull requests for preview deployments
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - 'apps/edit-docs/**'
      - 'apps/build-docs/**'
      - 'packages/share-theme/**'

jobs:
  build-and-deploy:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Required permissions for deployment
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Trigger build of documentation
        run: pnpm docs:build

      - name: Validate Built Site
        run: |
          test -f site/index.html || (echo "ERROR: site/index.html not found" && exit 1)
          test -f site/developer-guide/index.html || (echo "ERROR: site/developer-guide/index.html not found" && exit 1)
          echo "✓ User Guide and Developer Guide built successfully"

      - name: Deploy
        uses: ./.github/actions/deploy-to-cloudflare-pages
        if: ${{ github.event_name != 'pull_request' && github.repository == vars.REPO_MAIN }}
        with:
          project_name: "trilium-docs"
          deploy_dir: "site"
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A pull request from a fork reaches neither secrets nor vars, so the build
      # travels to deploy-previews.yml instead of deploying from here.
      - name: Upload preview
        uses: ./.github/actions/upload-cloudflare-preview
        if: ${{ github.event_name == 'pull_request' }}
        with:
          artifact_name: "docs-preview"
          deploy_dir: "site"
