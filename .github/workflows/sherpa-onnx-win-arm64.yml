name: sherpa-onnx for Windows arm64

# sherpa-onnx publishes no Node addon for Windows on arm64 (no `sherpa-onnx-win-arm64` on npm),
# so meeting transcription has nothing to load there. This builds that package from upstream's
# sources at the pinned version, linked against the win-arm64 libraries upstream releases, and
# uploads it as the `sherpa-onnx-win-arm64` artifact for the Windows arm64 desktop build.
# Remove it once upstream publishes the package (k2-fsa/sherpa-onnx, npm-addon-win-arm64.yaml).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build sherpa-onnx-win-arm64
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/desktop/package.json
            .github/workflows/sherpa-onnx-win-arm64.yml
          sparse-checkout-cone-mode: false

      - name: Read the pinned version
        id: version
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").dependencies["sherpa-onnx-node"]')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore a previous build
        id: cache
        uses: actions/cache@v6
        with:
          path: out/sherpa-onnx-win-arm64
          key: sherpa-onnx-win-arm64-${{ steps.version.outputs.version }}-${{ hashFiles('.github/workflows/sherpa-onnx-win-arm64.yml') }}

      - uses: actions/setup-node@v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: 24

      - name: Build the addon
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test "$(node -p process.arch)" = arm64

          git clone --quiet --depth 1 --branch "v$VERSION" https://github.com/k2-fsa/sherpa-onnx.git sherpa
          # The addon's sources are git symlinks, which a checkout without symlink support writes
          # as files holding the link target.
          cd sherpa
          git ls-files -s scripts/node-addon-api | awk '$1 == "120000" { print $4 }' | while read -r link; do
            if [ ! -L "$link" ]; then
              cp --remove-destination "$(dirname "$link")/$(cat "$link")" "$link"
            fi
          done
          cd ..

          libs="sherpa-onnx-v$VERSION-win-arm64-shared-MD-Release-lib"
          curl -sSfL -o libs.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$VERSION/$libs.tar.bz2"
          tar xjf libs.tar.bz2
          mkdir -p "$libs/include/sherpa-onnx/c-api"
          cp sherpa/sherpa-onnx/c-api/c-api.h "$libs/include/sherpa-onnx/c-api/"
          export SHERPA_ONNX_INSTALL_DIR="$PWD/$libs"

          cd sherpa/scripts/node-addon-api
          npm install --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/cmake-js compile -A ARM64
          cd ../../..

          out=out/sherpa-onnx-win-arm64
          mkdir -p "$out"
          cp sherpa/scripts/node-addon-api/build/Release/sherpa-onnx.node "$libs"/lib/*.dll "$out/"
          cp sherpa/LICENSE "$out/"
          cat > "$out/package.json" <<EOF
          {
            "name": "sherpa-onnx-win-arm64",
            "version": "$VERSION",
            "license": "Apache-2.0",
            "os": [ "win32" ],
            "cpu": [ "arm64" ]
          }
          EOF

      - name: Load the addon
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const addon = require("./out/sherpa-onnx-win-arm64/sherpa-onnx.node");
            if (addon.version !== process.env.VERSION) {
              throw new Error(`Built ${addon.version}, expected ${process.env.VERSION}`);
            }
            console.log(`sherpa-onnx ${addon.version}, onnxruntime ${addon.onnxruntimeVersion}`);
          '

      - uses: actions/upload-artifact@v7
        with:
          name: sherpa-onnx-win-arm64
          path: out/sherpa-onnx-win-arm64
          if-no-files-found: error
