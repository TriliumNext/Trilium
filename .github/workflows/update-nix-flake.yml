name: Update Nix flake

# Keeps flake.nix in step with the rest of the repo. Today that means one thing:
# the pinned Electron binary.
#
# nixpkgs lags behind the Electron releases we track, so the flake builds the exact
# pinned version from Electron's official binary release — and refuses to evaluate
# once the pin and apps/desktop/package.json drift apart:
#
#   error: flake.nix pins Electron 43.2.0, but apps/desktop/package.json wants 43.3.0
#
# Renovate bumps the devDependency but knows nothing about the pin, so this job
# closes the gap: it rewrites the pin and opens a PR. Triggered by the bump itself
# rather than on a schedule — a weekly job would leave the flake unevaluatable for
# up to a week, where this reacts within minutes of the bump landing on main.
on:
  push:
    branches:
      - main
    paths:
      - apps/desktop/package.json
  workflow_dispatch:

# Two bumps in quick succession would otherwise race to push the same PR branch,
# and it is the later package.json state that is worth acting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  electron-pin:
    name: Sync the pinned Electron binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set up node & dependencies
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Nix
        # The headers hash is a NAR hash of the unpacked tarball, so only Nix can
        # compute it — and the verification step below needs a working builder.
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Refresh the pin
        id: refresh
        run: |
          pnpm chore:update-flake-electron
          git diff --quiet -- flake.nix && changed=false || changed=true
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Read the wanted Electron version
        id: electron
        run: echo "version=$(node -p "require('./apps/desktop/package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"
      - name: Verify the pinned binary actually builds
        # Fetching both derivations checks the written hashes against the real
        # artifacts, so a bad hash fails here rather than in someone's `nix build`.
        if: steps.refresh.outputs.changed == 'true'
        run: nix build --no-link '.#electron' '.#electron.headers'
      - name: Open a PR
        if: steps.refresh.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: flake.nix
          branch: chore/update-flake-electron
          commit-message: "build(nix): pin Electron ${{ steps.electron.outputs.version }} in the flake"
          title: "build(nix): pin Electron ${{ steps.electron.outputs.version }} in the flake"
          body: |
            `apps/desktop/package.json` moved to Electron
            ${{ steps.electron.outputs.version }}, so `flake.nix` needs the matching
            binary pin — without it the flake refuses to evaluate.

            Regenerated by `pnpm chore:update-flake-electron`: the per-platform
            checksums come from the release's own `SHASUMS256.txt`, the headers hash
            from `nix-prefetch-url --unpack`. CI verified them by building
            `.#electron` and `.#electron.headers` before opening this PR.
          labels: dependencies
