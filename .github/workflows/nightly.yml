name: Nightly Release
on:
  # This can be used to automatically publish nightlies at UTC nighttime
  schedule:
    - cron: "0 2 * * *" # run at 2 AM UTC
  # This can be used to allow manually triggering nightlies from the web interface
  workflow_dispatch:
  push:
    branches:
      - renovate/electron-forge*
  pull_request:
    paths:
      - .github/actions/build-electron/*
      - .github/workflows/nightly.yml
      - forge.config.ts

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Assets are published to the public "nightly" release only for runs on the main
# branch (scheduled or manually dispatched). Runs on any other ref — PRs, branch
# dispatches, renovate pushes — keep their outputs as workflow artifacts instead.
# The main ref is intentionally a literal: the schedule event payload is minimal,
# so deriving the default branch from it is not reliable.

env:
  GITHUB_RELEASE_ID: 179589950

permissions:
  contents: write

jobs:
  nightly-electron:
    if: ${{ github.repository == vars.REPO_MAIN }}
    name: Deploy nightly
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        os:
          - name: macos
            image: macos-latest
            shell: bash
            forge_platform: darwin
          - name: linux
            image: ubuntu-22.04
            shell: bash
            forge_platform: linux
          - name: windows
            image: win-signing
            shell: cmd
            forge_platform: win32
        # Exclude ARM64 Linux from default matrix to use native runner
        exclude:
          - arch: arm64
            os:
              name: linux
        # Add ARM64 Linux with native ubuntu-24.04-arm runner for better-sqlite3 compatibility
        include:
          - arch: arm64
            os:
              name: linux
              image: ubuntu-24.04-arm
              shell: bash
              forge_platform: linux
    runs-on: ${{ matrix.os.image }}
    defaults:
      run:
        # Under pnpm/action-setup's pnpm 12 bootstrap, `pnpm` invoked from PowerShell on the
        # win-signing runner exits 0 without running anything, so the steps below have to
        # reach it through the same shell the build uses.
        shell: ${{ matrix.os.shell }}
    env:
      # "Update nightly version" rewrites the version field of six workspace manifests, which
      # makes the next `pnpm run` re-install the whole workspace even though the dependency
      # graph is unchanged. "Install dependencies" below is the authoritative install.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # pnpm derives its store from PNPM_HOME, which pnpm/action-setup points inside the
      # directory it reinstalls on every run. The win-signing runner is persistent, so the
      # store has to sit somewhere that survives between jobs, and packages have to be copied
      # out of it: rebuilding better-sqlite3 and electron-forge's pruning both write into
      # node_modules, which a hardlink would carry back into the shared store.
      - name: Keep the pnpm store outside the pnpm installation
        if: ${{ matrix.os.name == 'windows' }}
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "PNPM_CONFIG_STORE_DIR=C:\pnpm-store"
          Add-Content -Path $env:GITHUB_ENV -Value "PNPM_CONFIG_PACKAGE_IMPORT_METHOD=copy"
      - name: Set up node & dependencies
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Update nightly version
        run: pnpm run chore:ci-update-nightly-version
      - name: Run the build
        uses: ./.github/actions/build-electron
        with:
          os: ${{ matrix.os.name }}
          arch: ${{ matrix.arch }}
          shell: ${{ matrix.os.shell }}
          forge_platform: ${{ matrix.os.forge_platform }}
        env:
          APPLE_APP_CERTIFICATE_BASE64: ${{ secrets.APPLE_APP_CERTIFICATE_BASE64 }}
          APPLE_APP_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_APP_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          WINDOWS_SIGN_EXECUTABLE: ${{ vars.WINDOWS_SIGN_EXECUTABLE }}
          WINDOWS_SIGN_ERROR_LOG: ${{ vars.WINDOWS_SIGN_ERROR_LOG }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGN_KEY }}

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        with:
          make_latest: false
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          files: apps/desktop/upload/*.*
          tag_name: nightly
          name: Nightly Build

      - name: Publish artifacts
        uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
        with:
          name: TriliumNotes ${{ matrix.os.name }} ${{ matrix.arch }}
          path: apps/desktop/upload

  nightly-mobile:
    if: ${{ github.repository == vars.REPO_MAIN && github.event_name != 'pull_request' }}
    name: Build mobile nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build mobile APK
        uses: ./.github/actions/build-mobile
        with:
          nightly: "true"
          upload-artifact: "false"
          keystore-base64: ${{ secrets.NIGHTLY_ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.NIGHTLY_ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.NIGHTLY_ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.NIGHTLY_ANDROID_KEY_PASSWORD }}

      - name: Rename APK
        run: >-
          mv apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          apps/mobile/android/app/build/outputs/apk/release/TriliumNotes-mobile-nightly.apk

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          make_latest: false
          prerelease: true
          draft: false
          files: apps/mobile/android/app/build/outputs/apk/release/*.apk
          tag_name: nightly
          name: Mobile Nightly

      - name: Publish artifacts
        uses: actions/upload-artifact@v7
        if: ${{ github.ref != 'refs/heads/main' }}
        with:
          name: TriliumNotes mobile nightly
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          archive: false

  nightly-server:
    if: ${{ github.repository == vars.REPO_MAIN }}
    name: Deploy server nightly
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            runs-on: ubuntu-22.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run the build
        uses: ./.github/actions/build-server
        with:
          os: linux
          arch: ${{ matrix.arch }}

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        with:
          make_latest: false
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          files: upload/*.*
          tag_name: nightly
          name: Nightly Build

      - name: Publish artifacts
        uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
        with:
          name: TriliumNotes server linux ${{ matrix.arch }}
          path: upload
