name: Deploy Standalone App

on:
  # Trigger on push to main branch
  push:
    branches:
      - main
    # Only run when app files change
    paths:
      - 'apps/client/**'
      - 'apps/standalone/**'
      - 'packages/trilium-core/**'
      - '.github/workflows/deploy-app.yml'

  # Allow manual triggering from Actions tab
  workflow_dispatch:

  # Run on pull requests for preview deployments
  pull_request:
    paths:
      - 'apps/client/**'
      - 'apps/standalone/**'
      - 'packages/trilium-core/**'
      - '.github/workflows/deploy-app.yml'
jobs:
  build-and-deploy:
    name: Build and Deploy App
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Required permissions for deployment
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Update build info
        run: pnpm run chore:update-build-info

      - name: Trigger build of app
        run: pnpm --filter=standalone build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Deploy
        uses: ./.github/actions/deploy-to-cloudflare-pages
        if: github.event_name != 'pull_request' && github.repository == vars.REPO_MAIN
        with:
          project_name: "trilium-app"
          deploy_dir: "apps/standalone/dist"
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A pull request from a fork reaches neither secrets nor vars, so the build
      # travels to deploy-previews.yml instead of deploying from here.
      - name: Upload preview
        uses: ./.github/actions/upload-cloudflare-preview
        if: github.event_name == 'pull_request'
        with:
          artifact_name: "app-preview"
          deploy_dir: "apps/standalone/dist"
