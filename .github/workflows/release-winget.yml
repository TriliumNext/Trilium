name: Release to winget
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to release from'
        type: string
        required: true
# The winget publish authenticates with a PAT, the job token is not used.
permissions: {}

jobs:
  release-winget:
    if: ${{ !startsWith(github.event.release.tag_name, 'web-clipper-v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # main
        with:
          identifier: TriliumNext.Notes
          token: ${{ secrets.WINGET_PAT  }}
          release-tag:  ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
