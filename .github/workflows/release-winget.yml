name: Release to winget
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to release from'
        type: string
        required: true
jobs:
  release-winget:
    runs-on: ubuntu-latest
    steps:
      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@b3a5dae0047c6180023acba3f548c55fdf6b7193 # main
        with:
          identifier: TriliumNext.Notes
          token: ${{ secrets.WINGET_PAT  }}
          release-tag:  ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
