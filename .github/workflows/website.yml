name: Deploy website

on:
  push:
    branches:
      - main
      - stable
    paths:
      - "apps/website/**"

  pull_request:
    paths:
      - "apps/website/**"

  release:
    types: [ released ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & deploy website

    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up node & dependencies
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --filter website --frozen-lockfile --ignore-scripts

      - name: Build the website
        run: pnpm website:build

      - name: Deploy
        if: github.event_name != 'pull_request' && github.repository == vars.REPO_MAIN
        uses: ./.github/actions/deploy-to-cloudflare-pages
        with:
          project_name: "trilium-homepage"
          deploy_dir: "apps/website/dist"
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A pull request from a fork reaches neither secrets nor vars, so the build
      # travels to deploy-previews.yml instead of deploying from here.
      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/upload-cloudflare-preview
        with:
          artifact_name: "website-preview"
          deploy_dir: "apps/website/dist"
