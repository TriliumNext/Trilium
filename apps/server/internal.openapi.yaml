                    notePathTitle:
                      type: string
                      example: "Hidden Notes › User Guide › Scripting › Frontend Basics › Launch Bar Widgets › Analog Watch"
                    highlightedNotePathTitle:
                      type: string
                      example: "Hidden Notes › User Guide › Scripting › Frontend Basics › Launch Bar Widgets › Analog <b>Wat</b>ch"
                    highlightedNoteTitle:
                      type: string
                      example: "Analog <b>Wat</b>ch"
                    highlightedParentPathTitle:
                      type: string
                      example: "Hidden Notes › User Guide › Scripting › Frontend Basics › Launch Bar Widgets"
                    contentSnippet:
                      type: string
