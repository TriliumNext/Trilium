  # TOTP/2FA
  /api/totp/generate:
    get:
      tags: [Security]
      summary: Generate a TOTP secret
      description: >-
        Generates a fresh TOTP secret without persisting it. The caller must verify a code for this
        secret (see `/api/totp/verify`) and commit it (see `/api/totp/enable`) before it becomes active.
      operationId: generateTotpSecret
      responses:
        '200':
          description: TOTP secret generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    description: The bare TOTP secret (for manual entry), or an error message on failure.
                  url:
                    type: string
                    description: The `otpauth://` URL the authenticator expects, rendered as a QR code by the client.

  /api/totp/verify:
    post:
      tags: [Security]
      summary: Verify a generated TOTP secret
      description: >-
        Verifies a freshly generated secret against a code the user produced for it, without persisting
        anything. On success, issues (unpersisted) recovery codes to be shown as the next enrollment step.
      operationId: verifyTotpSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["secret", "token"]
              properties:
                secret:
                  type: string
                token:
                  type: string
                  description: A TOTP code the user generated for the supplied secret.
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  recoveryCodes:
                    type: array
                    description: One-time recovery codes, present only when verification succeeds.
                    items:
                      type: string

  /api/totp/enable:
    post:
      tags: [Security]
      summary: Enable TOTP with a verified secret
      description: >-
        Commits a verified secret together with its recovery codes, activating TOTP. This is the final
        enrollment step and the only point at which the secret and recovery codes are persisted.
      operationId: enableTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["secret", "recoveryCodes"]
              properties:
                secret:
                  type: string
                recoveryCodes:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Result of enabling TOTP
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/totp/status:
    get:
      tags: [Security]
      summary: Get TOTP status
      operationId: getTotpStatus
      responses:
        '200':
          description: TOTP status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: boolean
                    description: Whether TOTP is the active second factor and a secret is set.
                  set:
                    type: boolean
                    description: Whether a TOTP secret is currently stored.

  /api/totp/get:
    get:
      tags: [Security]
      summary: Get the stored TOTP secret
      description: Returns `null` when no secret is set.
      operationId: getTotpSecret
      responses:
        '200':
          description: TOTP secret
          content:
            application/json:
              schema:
                type:
                  - string
                  - 'null'

  /api/totp/reset:
    post:
      tags: [Security]
      summary: Reset (disable) TOTP
      description: Clears the stored TOTP secret and its recovery codes, disabling TOTP.
      operationId: resetTotp
      responses:
        '200':
          description: Result of resetting TOTP
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/totp_recovery/enabled:
    get:
      tags: [Security]
      summary: Check if TOTP recovery codes are set
      operationId: isTotpRecoveryEnabled
      responses:
        '200':
          description: TOTP recovery status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  keysExist:
                    type: boolean

  /api/totp_recovery/regenerate:
    post:
      tags: [Security]
      summary: Regenerate TOTP recovery codes
      description: >-
        Issues a fresh batch of recovery codes for the already-enrolled TOTP secret, replacing any
        existing ones, and returns them for one-time display. Refuses when no TOTP secret is set.
      operationId: regenerateTotpRecoveryCodes
      responses:
        '200':
          description: Generated recovery codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  recoveryCodes:
                    type: array
                    description: New recovery codes, present only when regeneration succeeds.
                    items:
                      type: string

  /api/totp_recovery/used:
    get:
      tags: [Security]
      summary: Get used TOTP recovery codes
      description: Returns an empty array if no recovery codes are set, otherwise an object listing each code's status.
      operationId: getUsedTotpRecoveryCodes
      responses:
        '200':
          description: Recovery code status
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {}
                    description: Empty array when no recovery codes are set.
                  - type: object
                    properties:
                      success:
                        type: boolean
                      usedRecoveryCodes:
                        type: array
                        description: >-
                          Per-code status. Each entry is either an ISO timestamp (when the code was
                          used) or the code's index as a string (when still unused).
                        items:
                          type: string

  /api/totp_recovery/verify:
    post:
      tags: [Security]
      summary: Verify a TOTP recovery code
      operationId: verifyTotpRecoveryCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["recovery_code_guess"]
              properties:
                recovery_code_guess:
                  type: string
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    
  # ETAPI tokens
  /api/etapi-tokens:
    get:
      tags: [Security]
      summary: List ETAPI tokens
      operationId: listEtapiTokens
      responses:
        '200':
          description: ETAPI tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EtapiToken'
                  
    post:
      tags: [Security]
      summary: Create ETAPI token
      operationId: createEtapiToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtapiToken'
                
  /api/etapi-tokens/{etapiTokenId}:
    patch:
      tags: [Security]
      summary: Update ETAPI token
      operationId: updateEtapiToken
      parameters:
        - name: etapiTokenId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Token updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtapiToken'
                
    delete:
      tags: [Security]
      summary: Delete ETAPI token
      operationId: deleteEtapiToken
      parameters:
        - name: etapiTokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Token deleted

  # Other utilities
  /api/stats/note-size/{noteId}:
    get:
      tags: [Utilities]
      summary: Get note size
      operationId: getNoteSize
      parameters:
        - $ref: '#/components/parameters/noteId'
      responses:
        '200':
          description: Note size
          content:
            application/json:
              schema:
                type: object
                properties:
                  size:
                    type: integer
                    
  /api/stats/subtree-size/{noteId}:
    get:
      tags: [Utilities]
      summary: Get subtree size
      operationId: getSubtreeSize
      parameters:
        - $ref: '#/components/parameters/noteId'
      responses:
        '200':
          description: Subtree size
          content:
            application/json:
              schema:
                type: object
                properties:
                  size:
                    type: integer
                    
  /api/keyboard-actions:
    get:
      tags: [Utilities]
      summary: Get keyboard actions
      operationId: getKeyboardActions
      responses:
        '200':
          description: Keyboard actions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    actionName:
                      type: string
                    shortcut:
                      type: string
                    description:
                      type: string
                      
  /api/keyboard-shortcuts-for-notes:
    get:
      tags: [Utilities]
      summary: Get keyboard shortcuts for notes
      operationId: getKeyboardShortcutsForNotes
      responses:
        '200':
          description: Keyboard shortcuts for notes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    noteId:
                      type: string
                    shortcut:
                      type: string
                    title:
                      type: string
                      
  /api/fonts:
    get:
      tags: [Utilities]
      summary: Get font CSS
      operationId: getFonts
      responses:
        '200':
          description: Font CSS
          content:
            text/css:
              schema:
                type: string
                
  /api/recent-notes:
    post:
      tags: [Utilities]
      summary: Add recent note
      operationId: addRecentNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [noteId]
              properties:
                noteId:
                  type: string
      responses:
        '204':
          description: Note added to recent
          
  /api/recent-changes/{ancestorNoteId}:
    get:
      tags: [Utilities]
      summary: Get recent changes
      operationId: getRecentChanges
      parameters:
        - name: ancestorNoteId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recent changes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    noteId:
                      type: string
                    title:
                      type: string
                    dateModified:
                      type: string
                      format: date-time
                      
  /api/recent-changes/{ancestorNoteId}/note-ids:
    get:
      tags: [Utilities]
      summary: Get recently changed note IDs
      description: |
        Returns the IDs of the most recently modified live notes under the ancestor, newest first.
        Under `root`, notes found only in the hidden subtree are left out.
      operationId: getRecentlyChangedNoteIds
      parameters:
        - name: ancestorNoteId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: true
          description: The maximum number of note IDs to return.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Note IDs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Missing or non-positive limit

  /api/icon-packs.css:
    get:
      tags: [Utilities]
      summary: Get the glyph of every icon
      description: >-
        A stylesheet with the `::before` rule that places the character of each icon of each icon
        pack. The bootstrap data carries the fonts of the packs and links this stylesheet with a
        `v` parameter derived from its content, so the response can be cached for good. Served
        without a session, like the bootstrap data that names it on the login screen.
      operationId: getIconPackGlyphCss
      security: []
      parameters:
        - name: v
          in: query
          required: false
          description: The content version the bootstrap data names; any value returns the current stylesheet
          schema:
            type: string
      responses:
        '200':
          description: The glyph rules of the icon packs
          content:
            text/css:
              schema:
                type: string

  /api/other/icon-registry:
    get:
      tags: [Utilities]
      summary: Get every icon of each icon pack
      description: >-
        Lists the icons that the icon picker searches. The bootstrap data names only the icon packs,
        since the full list runs to over a megabyte with many packs installed.
      operationId: getIconRegistry
      responses:
        '200':
          description: The icons of each icon pack
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        prefix:
                          type: string
                        name:
                          type: string
                        icon:
                          type: string
                          description: An icon class that identifies the pack
                        icons:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: The icon's classes, such as `bx bx-star`
                              terms:
                                type: array
                                items:
                                  type: string

  /api/other/icon-usage:
    get:
      tags: [Utilities]
      summary: Get icon usage statistics
      operationId: getIconUsage
      responses:
        '200':
          description: Icon usage stats
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  
  /api/other/render-markdown:
    post:
      tags: [Utilities]
      summary: Render markdown to HTML
      operationId: renderMarkdown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [markdownContent]
              properties:
                markdownContent:
                  type: string
      responses:
        '200':
          description: Rendered HTML
          content:
            text/html:
              schema:
                type: string
  /api/other/to-markdown:
    post:
      tags: [Utilities]
      summary: Renders given HTML to Markdown
      operationId: toMarkdown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [htmlContent]
              properties:
                htmlContent:
                  type: string
      responses:
        '200':
          description: Rendered Markdown
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: trilium.sid
      description: Session cookie obtained from login
      
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API token in format "Bearer {token}"
      
  parameters:
    noteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string
      description: 12-character note ID
      
  schemas:
    Note:
      type: object
      required:
        - noteId
        - title
        - type
        - mime
        - isProtected
      properties:
        noteId:
          type: string
          description: 12-character note ID
          example: ur11rSfHkzeV
        title:
          type: string
          description: Note title
        type:
          $ref: '#/components/schemas/NoteType'
        mime:
          type: string
          description: MIME type
          example: text/html
        isProtected:
          type: boolean
          description: Whether note is protected
        blobId:
          type: string
          description: ID of content blob
        dateCreated:
          $ref: '#/components/schemas/DateTime'
        dateModified:
          $ref: '#/components/schemas/DateTime'
        utcDateCreated:
          $ref: '#/components/schemas/UtcDateTime'
        utcDateModified:
          $ref: '#/components/schemas/UtcDateTime'
          
    NoteType:
      type: string
      enum:
        - text
        - code
        - render
        - file
        - image
        - search
        - relationMap
        - book
        - noteMap
        - mermaid
        - canvas
        - webView
        - launcher
        - doc
        - contentWidget
        - mindMap
        - geoMap

    Blob:
      type: object
      properties:
        blobId:
          type: string
          example: "8iqMIB8eiY1tPYmElfjm"
        content:
          type:
            - string
            - 'null'
          description: "`null` if not text."
        contentLength:
          type: integer
        dateModified:
          $ref: "#/components/schemas/DateTime"
        utcDateModified:
          $ref: "#/components/schemas/UtcDateTime"

    Branch:
      type: object
      required:
        - branchId
        - noteId
        - parentNoteId
        - notePosition
      properties:
        branchId:
          type: string
          description: Branch ID (parentNoteId_noteId)
        noteId:
          type: string
        parentNoteId:
          type: string
        notePosition:
          type: integer
        prefix:
          type: string
          nullable: true
        isExpanded:
          type: boolean
          
    Attribute:
      type: object
      required:
        - attributeId
        - noteId
        - type
        - name
        - value
      properties:
        attributeId:
          type: string
        noteId:
          type: string
        type:
          type: string
          enum: [label, relation]
        name:
          type: string
        value:
          type: string
        position:
          type: integer
        isInheritable:
          type: boolean
          
    Attachment:
      type: object
      required:
        - attachmentId
        - ownerId
        - role
        - mime
        - title
      properties:
        attachmentId:
          type: string
        ownerId:
          type: string
        role:
          type: string
          enum: [image, file]
        mime:
          type: string
        title:
          type: string
        blobId:
          type: string
        dateModified:
          $ref: '#/components/schemas/DateTime'
        utcDateModified:
          $ref: '#/components/schemas/UtcDateTime'

    Revision:
      type: object
      properties:
        revisionId:
          type: string
        noteId:
          type: string
        title:
          type: string
        type:
          $ref: '#/components/schemas/NoteType'
        mime:
          type: string
        dateCreated:
          $ref: '#/components/schemas/DateTime'
        utcDateCreated:
          $ref: '#/components/schemas/UtcDateTime'
          
    SearchResult:
      type: object
      properties:
        noteId:
          type: string
        title:
          type: string
        path:
          type: string
        score:
          type: number
        highlights:
          type: array
          items:
            type: string
            
    EntityChange:
      type: object
      properties:
        entityChange:
          type: object
          properties:
            entityName:
              type: string
            changeId:
              type: string
        entity:
          type: object

    DateTime:
     type: string
     example: "2025-02-14 08:19:59.203+0100"

    UtcDateTime:
      type: string
      example: "2025-02-13 07:42:47.698Z"
      description: "Result of `new Date().toISOString().replace('T', ' ')`"

    Timestamps:
      type: object
      properties:
        dateCreated:
          $ref: '#/components/schemas/DateTime'
        dateModified:
          $ref: '#/components/schemas/DateTime'
        utcDateCreated:
          $ref: '#/components/schemas/UtcDateTime'
        utcDateModified:
          $ref: '#/components/schemas/UtcDateTime'
          
    ReferenceKind:
      type: string
      enum: [heading, anchor]
      description: The kind of a target, which sets how the link lists show it
      example: heading

    ReferenceParams:
      type: object
      additionalProperties:
        type: string
      description: The parameters of a link that point at a target, not encoded
      example:
        block: eaJkN47U8kI4

    ReferenceTarget:
      type: object
      required: [kind, title]
      properties:
        kind:
          $ref: '#/components/schemas/ReferenceKind'
        title:
          type: string
          description: The plain text that the lists show
          example: Installation
        level:
          type: integer
          minimum: 1
          description: For a kind that nests, the depth of the target, such as 2 for an `<h2>`
          example: 2
        params:
          $ref: '#/components/schemas/ReferenceParams'
          description: The link parameters that point at the target; absent while it needs a reference

    NoteReferences:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceTarget'

    CreateNoteRequest:
      type: object
      required:
        - title
        - type
      properties:
        title:
          type: string
        content:
          type: string
        type:
          $ref: '#/components/schemas/NoteType'
        mime:
          type: string
        isProtected:
          type: boolean
        isExpanded:
          type: boolean
        notePosition:
          type: integer
        prefix:
          type: string
        parentNoteId:
          type: string
        templateNoteId:
          type: string
          
    ScriptBundle:
      type: object
      properties:
        noteId:
          type: string
        script:
          type: string
        html:
          type: string
        css:
          type: string
          
    AppInfo:
      type: object
      properties:
        appVersion:
          type: string
          example: 0.91.6
        dbVersion:
          type: integer
          example: 228
        nodeVersion:
          type: string
        syncVersion:
          type: integer
          example: 34
        buildDate:
          type: string
          format: date-time
        buildRevision:
          type: string
        dataDirectory:
          type: string
        clipperProtocolVersion:
          type: string
        utcDateTime:
          type: string
          format: date-time

    EtapiToken:
      type: object
      properties:
        etapiTokenId:
          type: string
        name:
          type: string
        token:
          type: string
        dateCreated:
          $ref: '#/components/schemas/DateTime'
        isDeleted:
          type: boolean
