                    highlightedContentSnippet:
                      type: string
                      example: "This is a more intricate example of a basic widget, which displays an analog <b>wat</b>ch in the launch bar."
                    contentSnippetTruncated:
                      type: boolean
                      example: true
                    attributeSnippet:
                      type: string
                      example: ""
                    matchedTerms:
                      type: array
                      items:
                        type: string
                      example:
                        - "wat"
