      parameters:
        - name: filePath
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Anonymized database file
          content:
            application/x-sqlite3:
              schema:
                type: string
                format: binary
        '400':
          description: Missing filePath
        '403':
          description: Path not allowed
        '404':
          description: File not found


