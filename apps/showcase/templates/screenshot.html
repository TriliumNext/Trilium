<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="common.css">
    <style>
        body {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            position: relative;
        }

        /* The store allows captions on at most 20% of a screenshot: 384 of 1920 px. */
        h1 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 384px;
            margin: 0;
            padding: 0 110px 24px;
            display: flex;
            align-items: flex-end;
            font-size: 88px;
            font-weight: 400;
            line-height: 1.08;
            letter-spacing: -0.03em;
            white-space: pre-line;
        }

        .app-shot {
            position: absolute;
            top: 456px;
            left: 90px;
            width: 900px;
            border-radius: 48px;
        }
    </style>
</head>
<body class="backdrop">
    <h1 id="caption"></h1>
    <img class="app-shot" id="shot" alt="">
    <script>
        window.render = ({ caption, shot, dark }) => {
            document.getElementById("caption").textContent = caption;
            document.getElementById("shot").src = shot;
            document.body.classList.toggle("dark", dark);
        };
    </script>
</body>
</html>
