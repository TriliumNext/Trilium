<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link rel="shortcut icon" href="favicon.ico">
        <link rel="apple-touch-icon" href="apple-touch-icon.png">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
        <link rel="manifest" crossorigin="use-credentials" href="manifest.webmanifest">
        <title>Trilium Notes</title>
        <!-- Desktop only: the first paint waits for this render-blocking script, which the main process answers once `desktop_startup.ts` releases it (see `first_paint_gate.ts`). -->
        <script>
            if (window.electronApi) {
                const firstPaintGate = document.createElement("script");
                firstPaintGate.src = "./startup-gate.js";
                firstPaintGate.async = true;
                firstPaintGate.setAttribute("blocking", "render");
                document.head.append(firstPaintGate);
            }
        </script>
        <!-- Requests the bootstrap data while index.ts downloads; `setupGlob()` in index.ts takes the response. -->
        <script>
            window.bootstrapRequest = fetch("./bootstrap" + location.search);
            window.bootstrapRequest.catch(() => {});
        </script>
        <!-- Paints the root background of the last start until the theme's stylesheets apply; `rememberRootBackground()` in services/theme.ts stores it. -->
        <script>
            try {
                const rootBackground = localStorage.getItem("trilium-root-background");
                if (rootBackground && !new URLSearchParams(location.search).has("print")) {
                    document.documentElement.style.backgroundColor = rootBackground;
                }
            } catch {}
        </script>
    </head>

    <body id="trilium-app">
        <noscript>
            Trilium requires JavaScript to be enabled.
        </noscript>

        <div id="context-menu-cover"></div>

        <!-- Required to match the PWA's top bar color with the theme -->
        <!-- This works even when the user directly changes --root-background in CSS -->
        <div id="background-color-tracker" style="position: absolute; visibility: hidden; color: var(--root-background); transition: color 1ms;"></div>

        <script src="./src/index.ts" type="module"></script>

        <!-- Required for correct loading of scripts in Electron -->
        <script>
            if (typeof module === 'object') {window.module = module; module = undefined;}
        </script>
    </body>
</html>
