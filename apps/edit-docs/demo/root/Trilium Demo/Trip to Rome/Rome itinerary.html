  <body>
    <div class="content">
      <h1 data-trilium-h1>Rome itinerary</h1>
      <div class="ck-content">
        <p>Three days in the Eternal City with <strong>Ana</strong>, <strong>Ben</strong> and <strong>Eve</strong>.</p>
        <h2>Day 1: Ancient Rome</h2>
        <p>Meet at <a class="reference-link" href="../Note%20Types/Geo%20Map%20(The%20Seven%20Wonders%20of%20the%20World)/The%20Colosseum%2C%20Rome%2C%20Italy.html">The Colosseum</a> at <strong>9:00</strong>, then walk through the <i>Roman Forum</i> to <span style="background-color:hsl(60,75%,60%);">Palatine Hill</span>.</p>
        <aside class="admonition tip">
          <p>Book the tickets online: the queue takes hours.</p>
        </aside>
        <h3>Where to eat</h3>
        <figure class="table" style="width:330px;">
          <table>
            <thead>
              <tr>
                <th>Place</th>
                <th>Order</th>
                <th>Price</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Trattoria</td>
                <td>Carbonara</td>
                <td>€18</td>
              </tr>
              <tr>
                <td>Pizzeria</td>
                <td>Margherita</td>
                <td>€11</td>
              </tr>
              <tr>
                <td>Gelateria</td>
                <td>Pistachio</td>
                <td>€4</td>
              </tr>
            </tbody>
          </table>
        </figure>
        <h3>Packing list</h3>
        <ul class="todo-list">
          <li><label class="todo-list__label"><input type="checkbox" checked="checked" disabled="disabled"><span class="todo-list__label__description">Passports</span></label></li>
          <li><label class="todo-list__label"><input type="checkbox" checked="checked" disabled="disabled"><span class="todo-list__label__description">Comfortable shoes</span></label></li>
          <li><label class="todo-list__label"><input type="checkbox" disabled="disabled"><span class="todo-list__label__description">Camera charger</span></label></li>
          <li><label class="todo-list__label"><input type="checkbox" disabled="disabled"><span class="todo-list__label__description">Travel adapter</span></label></li>
        </ul>
      </div>
    </div>
