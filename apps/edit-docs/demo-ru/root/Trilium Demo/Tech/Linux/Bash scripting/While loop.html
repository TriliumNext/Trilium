<h1 data-trilium-h1="">Цикл while</h1>
<div class="ck-content">
<p>Документация: <a href="http://tldp.org/LDP/Bash-Beginners-Guide/html/sect_09_02.html">http://tldp.org/LDP/Bash-Beginners-Guide/html/sect_09_02.html</a>
</p>
<pre><code class="language-text-x-sh">#!/bin/bash







# This script opens 4 terminal windows.







i="0"







while [ $i -lt 4 ]







do







    xterm &amp;







    i=$[$i+1]







done</code></pre>
